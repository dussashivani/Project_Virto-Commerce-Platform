# Virto Commerce - local deployment (Docker Compose)
# Scope: LOCAL DOCKER ONLY. This is not AWS and not Floci. See docs/ARCHITECTURE.md.
#
# Start:   ./scripts/up.sh          (or: docker compose up -d)
# Stop:    docker compose down      (data kept)   | ./scripts/cleanup.sh --volumes (data deleted)
# Verify:  ./scripts/validate.sh
name: virto

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  sqlserver:
    image: ${SQLSERVER_IMAGE}
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer            # local/dev only - use RDS (licensed) in AWS
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?run scripts/generate-env.sh}
      TZ: ${TZ:-UTC}
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -b -o /dev/null"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s
    networks: [backend]               # no published ports: DB is reachable only from the compose network
    logging: *default-logging

  elasticsearch:
    image: ${ELASTICSEARCH_IMAGE}
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"   # LOCAL ONLY (network-isolated). Enable TLS+auth in production.
      ES_JAVA_OPTS: -Xms512m -Xmx512m
      TZ: ${TZ:-UTC}
    ulimits:
      memlock: { soft: -1, hard: -1 }
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' >/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 30s
    networks: [backend]
    logging: *default-logging

  redis:
    image: ${REDIS_IMAGE}
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?run scripts/generate-env.sh}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks: [backend]
    logging: *default-logging

  platform:
    image: ${PLATFORM_IMAGE}
    restart: unless-stopped
    depends_on:
      sqlserver:      { condition: service_healthy }
      elasticsearch:  { condition: service_healthy }
      redis:          { condition: service_healthy }
    environment:
      ASPNETCORE_URLS: http://+:80
      ASPNETCORE_ENVIRONMENT: Production
      TZ: ${TZ:-UTC}
      # ASP.NET Core maps "__" to ":" so these override appsettings.json keys.
      ConnectionStrings__VirtoCommerce: "Data Source=sqlserver;Initial Catalog=${VC_DB_NAME};User ID=sa;Password=${MSSQL_SA_PASSWORD};MultipleActiveResultSets=True;TrustServerCertificate=True;Connect Timeout=30"
      ConnectionStrings__RedisConnectionString: "redis:6379,password=${REDIS_PASSWORD}"
      Search__Provider: ${SEARCH_PROVIDER:-ElasticSearch8}
      Search__Scope: ${SEARCH_SCOPE:-default}
      Search__ElasticSearch8__Server: http://elasticsearch:9200
      Search__ElasticSearch8__EnableCompatibilityMode: "true"
    volumes:
      - platform_appdata:/opt/virtocommerce/platform/App_Data       # modules, uploads, license
      - cms_content:/opt/virtocommerce/platform/wwwroot/cms-content # themes/pages shared with storefront
      - ./modules:/opt/virtocommerce/platform/modules:ro
    ports:
      - "127.0.0.1:${PLATFORM_HOST_PORT:-8090}:80"
    healthcheck:
      # TCP probe (aspnet base images do not ship curl). HTTP-level checks run from scripts/validate.sh.
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/80' || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 90s
    networks: [backend, frontend]
    logging: *default-logging

  storefront:
    # Official image. NOTE: Docker Hub shows it as not updated for ~2 years (legacy ASP.NET storefront).
    # Compatibility / security implications: docs/ARCHITECTURE.md section 6.
    # Started in a second phase (profile "storefront") because it needs the Platform initialised first.
    image: ${STOREFRONT_IMAGE}
    restart: unless-stopped
    depends_on:
      platform: { condition: service_healthy }
    environment:
      ASPNETCORE_URLS: http://+:80
      TZ: ${TZ:-UTC}
      # Platform connection (appsettings keys VirtoCommerce:Endpoint:*)
      VirtoCommerce__Endpoint__Url: ${PLATFORM_INTERNAL_URL:-http://platform}
      VirtoCommerce__Endpoint__UserName: ${STOREFRONT_API_USER:-frontend}
      VirtoCommerce__Endpoint__Password: ${STOREFRONT_API_PASSWORD:-}   # validated by scripts/up.sh --with-storefront
    volumes:
      - cms_content:/app/wwwroot/cms-content:ro
    ports:
      - "127.0.0.1:${STOREFRONT_HOST_PORT:-8080}:80"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/80' || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks: [frontend]              # storefront cannot reach the database / search / redis directly
    logging: *default-logging
    profiles: ["storefront"]

volumes:
  mssql_data:
  es_data:
  redis_data:
  platform_appdata:
  cms_content:

networks:
  backend:
    internal: false   # platform needs outbound HTTPS for module downloads; DB/ES/Redis publish no ports
  frontend:
