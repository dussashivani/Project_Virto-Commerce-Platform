
# Virto Commerce - local deployment (Docker Compose)
# Scope: LOCAL DOCKER ONLY. This is not AWS and not Floci.
#
# Start:   ./scripts/up.sh
# Stop:    docker compose down (data kept)
# Verify:  ./scripts/validate.sh

name: virto

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  sqlserver:
    image: ${SQLSERVER_IMAGE}
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?run scripts/generate-env.sh}
      TZ: ${TZ:-UTC}
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -b -o /dev/null"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s
    networks: [backend]
    logging: *default-logging

  elasticsearch:
    image: ${ELASTICSEARCH_IMAGE}
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
      TZ: ${TZ:-UTC}
    ulimits:
      memlock: { soft: -1, hard: -1 }
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' >/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 30s
    networks: [backend]
    logging: *default-logging

  redis:
    image: ${REDIS_IMAGE}
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?run scripts/generate-env.sh}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks: [backend]
    logging: *default-logging

  platform:
    image: ${PLATFORM_IMAGE}
    restart: unless-stopped
    depends_on:
      sqlserver:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      ASPNETCORE_URLS: http://+:80
      ASPNETCORE_ENVIRONMENT: Production
      TZ: ${TZ:-UTC}

      # Database and cache
      ConnectionStrings__VirtoCommerce: "Data Source=sqlserver;Initial Catalog=${VC_DB_NAME};User ID=sa;Password=${MSSQL_SA_PASSWORD};MultipleActiveResultSets=True;TrustServerCertificate=True;Connect Timeout=30"
      ConnectionStrings__RedisConnectionString: "redis:6379,password=${REDIS_PASSWORD}"

      # Elasticsearch
      Search__Provider: ${SEARCH_PROVIDER:-ElasticSearch8}
      Search__Scope: ${SEARCH_SCOPE:-default}
      Search__ElasticSearch8__Server: http://elasticsearch:9200
      Search__ElasticSearch8__EnableCompatibilityMode: "true"

      # Local email testing using Mailpit
      Notifications__Gateway: Smtp
      Notifications__DefaultSender: noreply@virto.local
      Notifications__Smtp__SmtpServer: mailpit
      Notifications__Smtp__Port: "1025"
      Notifications__Smtp__Login: ""
      Notifications__Smtp__Password: ""
      Notifications__Smtp__ForceSslTls: "false"

    volumes:
      - platform_appdata:/opt/virtocommerce/platform/App_Data
      - cms_content:/opt/virtocommerce/platform/wwwroot/cms-content
      - ./modules:/opt/virtocommerce/platform/modules:ro
    ports:
      - "127.0.0.1:${PLATFORM_HOST_PORT:-8090}:80"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/80' || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 90s
    networks: [backend, frontend]
    logging: *default-logging

  # Local SMTP email capture service
  mailpit:
    image: axllent/mailpit:latest
    container_name: virto-mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"
    networks: [backend]
    logging: *default-logging

  storefront:
    image: ${STOREFRONT_IMAGE}
    restart: unless-stopped
    depends_on:
      platform:
        condition: service_healthy
    environment:
      ASPNETCORE_URLS: http://+:80
      TZ: ${TZ:-UTC}
      VirtoCommerce__Endpoint__Url: ${PLATFORM_INTERNAL_URL:-http://platform}
      VirtoCommerce__Endpoint__UserName: ${STOREFRONT_API_USER:-frontend}
      VirtoCommerce__Endpoint__Password: ${STOREFRONT_API_PASSWORD:-}
    volumes:
      - cms_content:/app/wwwroot/cms-content:ro
    ports:
      - "127.0.0.1:${STOREFRONT_HOST_PORT:-8080}:80"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/80' || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks: [frontend]
    logging: *default-logging
    profiles: ["storefront"]

volumes:
  mssql_data:
  es_data:
  redis_data:
  platform_appdata:
  cms_content:

networks:
  backend:
    internal: false
  frontend:
